<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page 100 — Teletext Reborn</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<h1 class="sr">Page 100 — a teletext service reborn for the web</h1>
<div id="screen" role="img" aria-label="Teletext screen"></div>
<div id="fastext-bar" role="navigation" aria-label="Fastext links"></div>
<div id="keypad" aria-label="Teletext keypad">
  <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
  <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
  <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
  <button data-key="0">0</button>
  <button data-key="r">R</button><button data-key="g">G</button><button data-key="y">Y</button>
  <button data-key="b">B</button><button data-key="h">Hold</button>
  <button data-key="ArrowLeft">&#8592;</button><button data-key="ArrowRight">&#8594;</button>
  <button data-key="Enter">OK</button><button data-key="Backspace">&#9003;</button><button data-key="Escape">Esc</button>
</div>
<input id="search-input" type="text" autocomplete="off" autocapitalize="words" aria-hidden="true" tabindex="-1">
<div id="status"><span>Loading Page 100…</span><span></span></div>
<noscript><p style="color:#fff">Page 100 needs JavaScript.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
